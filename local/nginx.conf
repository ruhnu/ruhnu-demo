# DID host for the ruhnu DID recipient demo: serves did:web documents from /usr/share/nginx/html over TLS.
# did:web:localhost%3A8444:p:alice -> https://localhost:8444/p/alice/did.json
server {
    listen 8444 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    root /usr/share/nginx/html;

    location / {
        default_type application/did+json;
        try_files $uri =404;
    }
}
